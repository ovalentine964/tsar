[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsar"
version = "0.1.0"
description = "TSAR — self-improving autonomous trading system that compounds knowledge through use"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # --- Core ---
    "ccxt>=4.0",              # Exchange connectivity (REST)
    "pandas>=2.2",            # Data manipulation
    "pandas-ta>=0.3.14b1",    # Technical indicators
    "numpy>=1.26",            # Numerical computing
    "pydantic>=2.5",          # Data validation & settings
    "pyyaml>=6.0",            # YAML config parsing
    # --- Async & Networking ---
    "httpx>=0.27",            # Async HTTP client
    "aiohttp>=3.9",           # Async HTTP (ccxt streaming)
    # --- Database & Cache ---
    "redis>=5.0",             # Redis client (state, streams, cache)
    "aiosqlite>=0.20",        # Async SQLite driver
    # --- LLM Providers ---
    "ollama>=0.4",            # Ollama local LLM
    "openai>=1.12",           # OpenAI / DeepSeek compatible API
    "tiktoken>=0.7",          # Accurate token counting
    # --- API ---
    "fastapi>=0.110",         # REST API framework
    "uvicorn>=0.27",          # ASGI server
    "slowapi>=0.1.9",         # Rate limiting for FastAPI
    # --- Messaging ---
    "msgpack>=1.0",           # MessagePack serialization (CloudEvents payload)
    # --- Observability ---
    "structlog>=24.1",        # Structured logging
    "prometheus-client>=0.20", # Prometheus metrics
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "bandit>=1.7",
    "safety>=2.3",
]
rust = [
    "maturin>=1.4",           # Build Rust extensions via PyO3
]
nvidia = [
    "nvidia-cuopt>=24.08",     # GPU-accelerated optimization (cuOpt)
    "cupy-cuda12x>=13.0",      # CuPy for GPU array ops (CUDA 12.x)
    "nvidia-rag>=1.0",         # RAG Blueprint (retrieval-augmented generation)
    "nvidia-nemo-eval>=0.1",   # Nemo Evaluator for agent output quality
]
defi = [
    "web3>=7.0",               # EVM chain interaction (ETH, Polygon, Arbitrum, Base)
    "solana>=0.35",            # Solana RPC client
    "solders>=0.21",           # Solana keypair & transaction signing
    "cryptography>=42.0",      # Fernet encryption for wallet key storage
    "eth-account>=0.13",       # Ethereum account/key management
    "httpx>=0.27",             # HTTP client for 1inch & Jupiter APIs
]

[project.scripts]
tsar = "src.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
