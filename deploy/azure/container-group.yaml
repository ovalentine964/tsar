# ============================================================
# TSAR — Azure Container Instances (ACI) Deployment
# ============================================================
# Free-tier optimized: 1 vCPU total, 1 GB RAM total
#   - TSAR app: 0.75 vCPU, 640 MB RAM
#   - Redis:    0.25 vCPU, 256 MB RAM
#
# This is a TEMPLATE — values with ${...} are resolved by
# scripts/deploy-azure.sh at deploy time.
#
# Manual deployment:
#   az container create \
#     --resource-group tsar-rg \
#     --file deploy/azure/container-group.resolved.yaml \
#     --location eastus
# ============================================================

apiVersion: "2021-10-01"
location: eastus
name: tsar-container-group
type: Microsoft.ContainerInstance/containerGroups

properties:
  osType: Linux
  restartPolicy: OnFailure

  # ── IP & Networking ──────────────────────────────────────
  ipAddress:
    type: Public
    ports:
      - port: 8000
        protocol: TCP
    dnsNameLabel: tsar-app        # → tsar-app.<region>.azurecontainer.io

  # ── Shared Volumes (Azure File Shares) ───────────────────
  volumes:
    - name: tsar-data
      azureFile:
        shareName: tsar-data
        storageAccountName: ${STORAGE_ACCOUNT}
        storageAccountKey: ${STORAGE_KEY}
    - name: tsar-logs
      azureFile:
        shareName: tsar-logs
        storageAccountName: ${STORAGE_ACCOUNT}
        storageAccountKey: ${STORAGE_KEY}

  # ── Containers ───────────────────────────────────────────
  containers:

    # ─── TSAR Application ───────────────────────────────────
    - name: tsar-app
      properties:
        image: ${IMAGE_REF}
        resources:
          requests:
            cpu: 0.75
            memoryInGb: 0.6

        ports:
          - port: 8000
            protocol: TCP

        environmentVariables:
          # App config
          - name: TSAR_ENVIRONMENT
            value: production
          - name: TSAR_TRADING_MODE
            value: paper
          - name: TSAR_API_PORT
            value: "8000"
          - name: PYTHONUNBUFFERED
            value: "1"
          # Redis connection (sidecar on localhost)
          - name: REDIS_HOST
            value: localhost
          - name: REDIS_PORT
            value: "6379"
          # Non-secret env
          - name: TSAR_CORS_ORIGINS
            value: "${TSAR_CORS_ORIGINS}"
          - name: EXCHANGE_SANDBOX
            value: "true"
          - name: TELEGRAM_CHAT_ID
            value: "${TELEGRAM_CHAT_ID}"

        # Secrets (injected securely)
        secureEnvironmentVariables:
          - name: REDIS_PASSWORD
            value: "${REDIS_PASSWORD}"
          - name: EXCHANGE_API_KEY
            value: "${EXCHANGE_API_KEY}"
          - name: EXCHANGE_SECRET
            value: "${EXCHANGE_SECRET}"
          - name: NVIDIA_API_KEY
            value: "${NVIDIA_API_KEY}"
          - name: TSAR_API_KEY
            value: "${TSAR_API_KEY}"
          - name: TELEGRAM_BOT_TOKEN
            value: "${TELEGRAM_BOT_TOKEN}"

        # Volume mounts
        volumeMounts:
          - name: tsar-data
            mountPath: /app/data
          - name: tsar-logs
            mountPath: /app/logs

        # Liveness probe — restart if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3

        # Readiness probe — remove from LB if not ready
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3

    # ─── Redis Sidecar ──────────────────────────────────────
    - name: tsar-redis
      properties:
        image: redis:7-alpine
        resources:
          requests:
            cpu: 0.25
            memoryInGb: 0.4

        command:
          - redis-server
          - --appendonly
          - "yes"
          - --maxmemory
          - 256mb
          - --maxmemory-policy
          - allkeys-lru
          - --requirepass
          - "${REDIS_PASSWORD}"
          - --loglevel
          - warning

        # Liveness — restart if Redis can't respond
        livenessProbe:
          exec:
            command:
              - redis-cli
              - -a
              - "${REDIS_PASSWORD}"
              - ping
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

        # Redis data persistence
        volumeMounts:
          - name: tsar-data
            mountPath: /data
            subPath: redis

  # ── Tags ─────────────────────────────────────────────────
  tags:
    project: tsar
    environment: production
    managed-by: azure-container-instances
