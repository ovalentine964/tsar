# ============================================================
# TSAR — Docker Compose (Production-Ready)
# ============================================================
# Services: Redis 7 + TSAR App (Python 3.12)
#
# Usage:
#   cp .env.example .env   # Configure environment
#   docker compose build    # Build images
#   docker compose up -d    # Start services
#   docker compose down     # Stop services
#   docker compose logs -f  # Follow logs
#
# Azure Free Tier: 1 vCPU, 1 GB RAM total
#   Redis:  0.25 CPU, 256 MB RAM
#   TSAR:   0.75 CPU, 640 MB RAM
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: tsar-redis
    # SECURITY: Redis is NOT exposed to host — only accessible via tsar-net
    # Remove the ports mapping to prevent external access.
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"  # DANGEROUS — do not expose in production
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --loglevel warning
      --protected-mode yes
      --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tsar-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tsar-app
    # App port only exposed to localhost for nginx reverse proxy
    # External traffic goes through nginx (port 443/TLS)
    ports:
      - "127.0.0.1:${TSAR_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - tsar-data:/app/data
      - tsar-logs:/app/logs
      - ./config:/app/config:ro
      - ./migrations:/app/migrations:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - tsar-net

  # ── TLS Termination Proxy (Nginx) ───────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: tsar-nginx
    ports:
      - "${TSAR_HTTPS_PORT:-443}:443"
      - "${TSAR_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/tls/nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://localhost:443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - tsar-net

  # ----------------------------------------------------------
  # Monitoring (Optional) — enable with: docker compose --profile monitoring up
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tsar-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tsar-net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: tsar-grafana
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SECURE=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tsar-net

volumes:
  redis-data:
    driver: local
  tsar-data:
    driver: local
  tsar-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  tsar-net:
    driver: bridge
