# ============================================================
# TSAR — GitHub Actions CI Pipeline
# ============================================================
# Runs on every push/PR to main and develop branches.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.79"
  CMAKE_VERSION: "3.28"

jobs:
  # ----------------------------------------------------------
  # Lint
  # ----------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ----------------------------------------------------------
  # Type Check
  # ----------------------------------------------------------
  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/

  # ----------------------------------------------------------
  # Tests
  # ----------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: test_password
      TSAR_ENVIRONMENT: test
      TSAR_TRADING_MODE: paper
      TSAR_API_KEY: test_api_key_for_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ----------------------------------------------------------
  # Rust Build & Test
  # ----------------------------------------------------------
  rust:
    name: Rust (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

  # ----------------------------------------------------------
  # C++ Build & Test
  # ----------------------------------------------------------
  cpp:
    name: C++ (CMake + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-all-dev

      - name: Configure (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DTSAR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure -j$(nproc)

  # ----------------------------------------------------------
  # Security
  # ----------------------------------------------------------
  security:
    name: Security (safety + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install safety bandit

      - name: Check dependencies (safety)
        run: safety check --full-report
        continue-on-error: true

      - name: Static analysis (bandit)
        run: bandit -r src/ -c pyproject.toml

  # ----------------------------------------------------------
  # Docker Build
  # ----------------------------------------------------------
  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, rust, cpp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: tsar:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker run --rm tsar:latest python -c "import src; print('✅ Import OK')"
