# ============================================================
# TSAR Mobile — Flutter CI + APK Build
# ============================================================
name: Flutter CI + APK

on:
  push:
    branches: [main, develop]
    paths: ['mobile/**']
  pull_request:
    branches: [main, develop]
    paths: ['mobile/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  # ── Analyze & Test ──────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --coverage || echo "No tests yet"

  # ── Build APK ───────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pin Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0' || true
          # Remove corrupted SDK 35
          rm -rf $ANDROID_HOME/platforms/android-35 || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsar-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── GitHub Pages Release ────────────────────────────────────
  release:
    name: Update gh-pages
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: tsar-mobile-apk
          path: download/

      - name: Update index.html version info
        run: |
          COMMIT_SHA="${GITHUB_SHA::8}"
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          sed -i "s|v[0-9]*\.[0-9]*\.[0-9]* &middot; Alpha|v0.1.0 \&middot; Alpha|g" index.html
          sed -i "s|Commit [a-f0-9]*|Commit ${COMMIT_SHA}|g" index.html
          sed -i "s|Built [0-9-]*|Built ${BUILD_DATE}|g" index.html

      - name: Commit updated APK to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/app-release.apk index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update APK to ${GITHUB_SHA::8}"
          git push
