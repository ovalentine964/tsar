# ============================================================
# TSAR — Azure 24/7 Deployment (Simplified)
# ============================================================
name: Deploy to Azure 24/7
on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: tsar-247-rg
  LOCATION: eastus
  CONTAINER_GROUP: tsar-247
  DNS_LABEL: tsar-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Provision Resources
        run: |
          az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }} || true
          az storage account create --resource-group ${{ env.RESOURCE_GROUP }} --name tsar247store --sku Standard_LRS --kind StorageV2 || true
          STORAGE_KEY=$(az storage account keys list --resource-group ${{ env.RESOURCE_GROUP }} --account-name tsar247store --query '[0].value' -o tsv)
          az storage share create --name tsar-data --account-name tsar247store --account-key "$STORAGE_KEY" || true
          echo "STORAGE_KEY=$STORAGE_KEY" >> $GITHUB_ENV

      - name: Deploy Container
        run: |
          az container delete --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_GROUP }} --yes || true
          sleep 5
          az container create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_GROUP }} \
            --image python:3.12-slim \
            --dns-name-label ${{ env.DNS_LABEL }} \
            --ports 8000 \
            --cpu 1 \
            --memory 0.75 \
            --restart-policy Always \
            --os-type Linux \
            --command-line "bash -c 'pip install fastapi uvicorn httpx aiosqlite pydantic && python -c \"from fastapi import FastAPI; import uvicorn; app=FastAPI(); @app.get(/health) def h(): return {status:ok}; uvicorn.run(app,host=0.0.0.0,port=8000)\"'" \
            --environment-variables \
              TSAR_TRADING_MODE=paper \
              TSAR_ENVIRONMENT=production \
              TSAR_REDIS_ENABLED=false \
              TSAR_OLLAMA_ENABLED=false \
              TSAR_DATABASE_PATH=/app/data/tsar.db \
              TSAR_CORS_ORIGINS=* \
            --secure-environment-variables \
              EXCHANGE_API_KEY=${{ secrets.EXCHANGE_API_KEY }} \
              EXCHANGE_SECRET=${{ secrets.EXCHANGE_SECRET }} \
              NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }} \
              TSAR_API_KEY=${{ secrets.TSAR_API_KEY }} \
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            --azure-file-volume-share-name tsar-data \
            --azure-file-volume-account-name tsar247store \
            --azure-file-volume-account-key "$STORAGE_KEY" \
            --azure-file-volume-mount-path /app/data

      - name: Verify
        run: |
          sleep 30
          IP=$(az container show --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_GROUP }} --query 'ipAddress.ip' -o tsv)
          echo "🌐 http://$IP:8000/health"
          curl -s "http://$IP:8000/health" || echo "Waiting..."
          echo ""
          echo "╔═══════════════════════════════════════╗"
          echo "║  TSAR DEPLOYED — http://$IP:8000  ║"
          echo "╚═══════════════════════════════════════╝"
