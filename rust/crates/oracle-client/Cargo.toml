[package]
name = "tsar-oracle-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Oracle client: Chainlink and Pyth price feed reading, price aggregation, and TWAP computation"

[dependencies]
tsar-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# Ethereum ABI for Chainlink
ethers = { version = "2.0", features = ["abigen"] }
alloy-primitives = "0.7"
alloy-sol-types = "0.7"
# Pyth
pyth-sdk-solana = "0.10"
