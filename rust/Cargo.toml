[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ws-manager",
    "crates/tick-processor",
    "crates/order-executor",
    "crates/mev-scanner",
    "crates/gas-optimizer",
    "crates/dex-aggregator",
    "crates/price-feed",
    "crates/evm-client",
    "crates/solana-client",
    "crates/oracle-client",
    "crates/mev-client",
    "crates/rules-enforcer",
    "crates/pyo3-bindings",
    "crates/strategy-vmpm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
repository = "https://github.com/your-org/tsar"

[workspace.dependencies]
# === Async Runtime ===
tokio = { version = "1.36", features = ["full"] }

# === WebSocket ===
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# === Error Handling ===
thiserror = "1.0"

# === Logging ===
tracing = "0.1"

# === Time ===
chrono = { version = "0.4", features = ["serde"] }

# === HTTP ===
reqwest = { version = "0.12", features = ["json", "native-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# === PyO3 ===
pyo3 = { version = "0.21", features = ["extension-module"] }

# === Utils ===
uuid = { version = "1.8", features = ["v4", "serde"] }

# === Blockchain ===
ethers = { version = "2.0", features = ["abigen", "ws"] }
alloy-primitives = "0.7"
alloy-sol-types = "0.7"
solana-sdk = "2.0"
solana-client = "2.0"
solana-account-decoder = "2.0"
spl-token = "4.0"
ed25519-dalek = "2.1"
pyth-sdk-solana = "0.10"
k256 = "0.13"
bs58 = "0.5"
bincode = "1.3"

# === Internal Crates ===
tsar-core = { path = "crates/core" }
tsar-ws-manager = { path = "crates/ws-manager" }
tsar-tick-processor = { path = "crates/tick-processor" }
tsar-order-executor = { path = "crates/order-executor" }
tsar-mev-scanner = { path = "crates/mev-scanner" }
tsar-gas-optimizer = { path = "crates/gas-optimizer" }
tsar-dex-aggregator = { path = "crates/dex-aggregator" }
tsar-price-feed = { path = "crates/price-feed" }
tsar-evm-client = { path = "crates/evm-client" }
tsar-solana-client = { path = "crates/solana-client" }
tsar-oracle-client = { path = "crates/oracle-client" }
tsar-mev-client = { path = "crates/mev-client" }
tsar-rules-enforcer = { path = "crates/rules-enforcer" }
strategy-vmpm = { path = "crates/strategy-vmpm" }
