# ============================================================
# TSAR — Backend Configuration
# ============================================================
# Maps abstract interfaces to concrete implementations.
# Change primary → hot-swap backend. No agent code changes.
# See TSAR_ARCHITECTURE.md §2.3

exchange_gateway:
  primary: "src.backends.python.ccxt_gateway.CcxtGateway"
  fallback:
    - path: "src.interfaces.exchange.rust_gateway.RustGateway"
      priority: 200
  config:
    sandbox: true
    rate_limit_per_minute: 1200
    timeout_s: 15

pricing_engine:
  primary: "src.backends.python.pandas_ta_engine.PandasTAEngine"
  fallback:
    - path: "src.interfaces.pricing.rust_tick_engine.RustTick"
      priority: 200
  config:
    default_timeframe: "1h"

execution_engine:
  primary: "src.backends.python.ccxt_exec_engine.CcxtExecEngine"
  fallback:
    - path: "src.interfaces.execution.rust_exec_engine.RustExecEngine"
      priority: 200
  config:
    slippage_model: "realistic"  # zero | fixed | realistic
    slippage_mean_bps: 3
    slippage_std_bps: 2

risk_engine:
  primary: "src.backends.python.python_risk_engine.PythonRiskEngine"
  fallback:
    - path: "src.interfaces.risk.rust_risk_engine.RustRiskEngine"
      priority: 200
  config:
    config_path: "config/risk.yaml"

llm_provider:
  # NVIDIA NIM primary (free tier, cloud-hosted)
  # Ollama disabled by default — set TSAR_ENABLE_OLLAMA=1 to re-enable
  primary: "src.backends.python.openai_provider.OpenAIProvider"
  fallback:
    - path: "src.backends.python.deepseek_provider.DeepSeekProvider"
      priority: 200
    - path: "src.backends.python.ollama_provider.OllamaProvider"
      priority: 400
  config:
    config_path: "config/models.yaml"

# --- Settlement & L2 Optimization ---
settlement_engine:
  primary: "src.backends.defi.settlement.SettlementEngine"
  config:
    chain: "arbitrum"                   # ethereum | polygon | arbitrum | optimism | base
    settlement_timeout_s: 3600           # 1 hour
    max_retries: 3
    gas_limit_buffer: 1.2               # 20% buffer on gas estimates
    confirmation_timeout_s: 600          # 10 min
    multisig_threshold: 2                # approvals needed for large trades
    multisig_threshold_usd: 100000       # trades above this require multi-sig
  escrow_contracts:
    ethereum: "${ETH_ESCROW_ADDRESS}"
    polygon: "${POLYGON_ESCROW_ADDRESS}"
    arbitrum: "${ARBITRUM_ESCROW_ADDRESS}"
    optimism: "${OPTIMISM_ESCROW_ADDRESS}"
    base: "${BASE_ESCROW_ADDRESS}"
  multisig:
    wallet: "${MULTISIG_WALLET_ADDRESS}"
    signers:
      - "${SIGNER_1_ADDRESS}"
      - "${SIGNER_2_ADDRESS}"
      - "${SIGNER_3_ADDRESS}"

l2_optimizer:
  primary: "src.backends.defi.l2_optimizer.L2Optimizer"
  config:
    eth_price_usd: 3000.0               # updated via oracle in production
    gas_limit_default: 200000
    priority_fee_gwei: 1.5
    max_fee_multiplier: 1.5
    cache_ttl_s: 12                      # gas price cache TTL
    batch_max_size: 50
    batch_max_gas: 5000000
  rpc_endpoints:
    ethereum: "${ETH_RPC_URL}"
    polygon: "${POLYGON_RPC_URL}"
    arbitrum: "${ARBITRUM_RPC_URL}"
    optimism: "${OPTIMISM_RPC_URL}"
    base: "${BASE_RPC_URL}"
  gas_params:
    # EIP-1559 base fee tracking
    base_fee_update_interval_s: 12       # one block on Ethereum
    priority_fee_percentiles: [25, 50, 75, 95]
    # Chain-specific overrides
    overrides:
      polygon:
        priority_fee_gwei: 30.0          # Polygon needs higher priority
      arbitrum:
        gas_limit_default: 80000         # L2s need less gas
      optimism:
        gas_limit_default: 80000
      base:
        gas_limit_default: 80000
