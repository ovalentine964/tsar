# ============================================================
# TSAR — Cross-Chain & Intent Protocol Configuration
# ============================================================
# Bridge protocol settings, intent protocol endpoints, and solver URLs.
# See TSAR_ARCHITECTURE.md §7

# --- Cross-Chain Bridge Configuration ---
bridge:
  # Global bridge settings
  default_preference: "cheapest"  # cheapest | fastest | most_reliable
  max_slippage_bps: 100           # Max acceptable slippage for bridge quotes
  quote_timeout_s: 10             # Timeout for fetching bridge quotes
  monitoring_interval_s: 30       # How often to check pending bridge status

  # Wormhole Protocol
  wormhole:
    enabled: true
    api_base: "https://api.wormholescan.io"
    portal_bridge: "https://wormhole.io"
    api_key: "${WORMHOLE_API_KEY}"
    guardian_rpc: "https://wormhole-v2-mainnet-api.certus.one"
    supported_chains:
      - ethereum
      - solana
      - polygon
      - arbitrum
      - base
      - avalanche
    # Guardian network settings
    guardians:
      quorum: 13  # Minimum guardians for attestation
      retry_attempts: 3
      retry_delay_s: 5

  # LayerZero Protocol
  layerzero:
    enabled: true
    api_base: "https://api.layerzero.network"
    supported_chains:
      - ethereum
      - polygon
      - arbitrum
      - base
      - avalanche
    # Oracle + Relayer configuration
    oracle:
      endpoint: "https://lz-oracle.mainnet.io"
      chain_ids:
        ethereum: 101
        polygon: 109
        arbitrum: 110
        base: 184
        avalanche: 106
    relayer:
      endpoint: "https://lz-relayer.mainnet.io"
      native_fee_buffer_bps: 10  # Extra buffer for native fee estimation

  # Axelar Protocol
  axelar:
    enabled: true
    api_base: "https://api.axelarscan.io"
    gateway_api: "https://lcd-axelar.imperator.co"
    supported_chains:
      - ethereum
      - polygon
      - arbitrum
      - base
      - avalanche
    # GMP (General Message Passing) settings
    gmp:
      gas_estimate_multiplier: 1.2  # Safety multiplier for gas estimates
      destination_gas_buffer_bps: 15

# --- Intent Protocol Configuration ---
intent:
  # Global intent settings
  default_slippage_bps: 50
  quote_timeout_s: 15
  settlement_verification: true  # Verify settlements on-chain
  verification_tolerance_bps: 100

  # CoW Protocol (Coincidence of Wants)
  cow_protocol:
    enabled: true
    api_base: "https://api.cow.fi/mainnet"
    explorer: "https://explorer.cow.fi"
    supported_chains:
      - ethereum
    # Solver competition settings
    solver_urls:
      - "https://solver.cow.fi"
      - "https://solver-1.cow.fi"
      - "https://solver-2.cow.fi"
    auction:
      duration_s: 30
      max_slippage_bps: 100
      solver_count_estimate: 8
    # Order signing
    signing:
      eip712_domain: "COW Protocol"
      eip712_version: "v4"

  # UniswapX
  uniswapx:
    enabled: true
    api_base: "https://api.uniswap.org/v1"
    supported_chains:
      - ethereum
      - arbitrum
      - base
    # Dutch auction settings
    auction:
      duration_s: 60
      max_slippage_bps: 100
      filler_count_estimate: 5
    # Reactor contracts (order settlement)
    reactors:
      ethereum: "0x6000da47483062A0D734Ba3dc7576Ce6A0B645C4"
      arbitrum: "0x6000da47483062A0D734Ba3dc7576Ce6A0B645C4"
      base: "0x6000da47483062A0D734Ba3dc7576Ce6A0B645C4"

  # 1inch Fusion
  oneinch_fusion:
    enabled: true
    api_base: "https://fusion.1inch.io"
    api_key: "${ONEINCH_API_KEY}"
    supported_chains:
      - ethereum
      - arbitrum
      - base
    # Resolver competition settings
    auction:
      duration_s: 45
      max_slippage_bps: 100
      resolver_count_estimate: 12
    # Supported tokens
    tokens:
      ethereum:
        - ETH
        - WETH
        - USDC
        - USDT
        - DAI
        - WBTC
      arbitrum:
        - ETH
        - WETH
        - USDC
        - USDT
      base:
        - ETH
        - WETH
        - USDC

