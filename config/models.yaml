    cost_per_1k_output_tokens: 0.0006

# --- Task Type Routing ---
# Agents call: router.generate(task_type="t2_signal_narrative")
# No model names in agent code.

routing:
  # --- Tier 1: Embeddings ---
  t1_pattern_embedding:
    primary: "nvidia_nim/nvidia/nv-embedqa-e5-v5"
    fallback:
      - "deepseek/deepseek-reasoner"  # Text fallback if embed endpoint unavailable
    params: {}

  # --- Tier 2: Routine tasks (NVIDIA NIM primary, DeepSeek fallback) ---
  t2_regime_explanation:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 1024
      temperature: 0.3

  t2_signal_narrative:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 1024
      temperature: 0.3

  t2_risk_explanation:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 512
      temperature: 0.2

  t2_trade_summary:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 1024
      temperature: 0.3

  t2_news_sentiment:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 512
      temperature: 0.1

  t2_daily_summary:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 2048
      temperature: 0.3

  t2_anomaly_explanation:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 1024
      temperature: 0.3

  t2_strategy_evaluation:
    primary: "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
    fallback:
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 2048
      temperature: 0.3

  # --- Tier 3: Complex reasoning (NVIDIA NIM DeepSeek R1 primary) ---
  t3_trade_narrative:
    primary: "nvidia_nim/deepseek-ai/deepseek-r1"
    fallback:
      - "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      - "nvidia_nim/minimaxai/minimax-m3"
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 4096
      temperature: 0.3

  t3_strategy_synthesis:
    primary: "nvidia_nim/deepseek-ai/deepseek-r1"
    fallback:
      - "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      - "nvidia_nim/minimaxai/minimax-m3"
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 4096
      temperature: 0.5

  t3_risk_scenario:
    primary: "nvidia_nim/deepseek-ai/deepseek-r1"
    fallback:
      - "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      - "nvidia_nim/minimaxai/minimax-m3"
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 4096
      temperature: 0.2

  t3_bias_detection:
    primary: "nvidia_nim/deepseek-ai/deepseek-r1"
    fallback:
      - "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
      - "nvidia_nim/minimaxai/minimax-m3"
      - "deepseek/deepseek-reasoner"
    params:
      max_tokens: 2048
      temperature: 0.3

# --- Budget Limits ---
budget:
  daily_limit_usd: 1.00
  monthly_limit_usd: 20.00
  alert_threshold_pct: 80  # Alert at 80% of budget

# --- Cost-Effective Intelligence ---
# ComplexityRouter uses these tiers to auto-select models.
# Simple tasks → cheapest model, complex tasks → best model.
# Override tiers in ComplexityRouter constructor if needed.
cost_optimization:
  enabled: true
  # When budget drops below this %, auto-downgrade models
  budget_downgrade_threshold_pct: 70
  # When budget drops below this %, use only free models
  budget_free_only_threshold_pct: 90
  # Track cost per trade for ROI calculation
  track_per_trade_cost: true

# --- Circuit Breaker ---
circuit_breaker:
  failure_threshold: 5       # Open after 5 consecutive failures
  recovery_timeout_s: 60     # Try again after 60s
  half_open_max_calls: 1     # Probe with 1 call
