# ============================================================
# TSAR — LLM Model Configuration
# ============================================================
# Zero model names in source code. All routing via task_type.
# See TSAR_ARCHITECTURE.md §8

# --- Provider Definitions ---
# NOTE: Ollama is disabled by default (requires too much RAM for free-tier).
# Set TSAR_ENABLE_OLLAMA=1 to re-enable local LLM.
providers:
  nvidia_nim:
    type: "openai_compatible"
    api_key: "${NVIDIA_API_KEY}"
    base_url: "https://integrate.api.nvidia.com/v1"
    timeout_s: 60
    max_concurrent: 2

  deepseek:
    type: "openai_compatible"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    timeout_s: 60
    max_concurrent: 2

  openai:
    type: "openai_compatible"
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    timeout_s: 60
    max_concurrent: 2

  # Ollama disabled by default — enable with TSAR_ENABLE_OLLAMA=1
  ollama:
    type: "ollama"
    base_url: "http://localhost:11434"
    timeout_s: 30
    max_concurrent: 4
    enabled: false

# --- Model Definitions ---
models:
  ollama/qwen2.5:7b:
    display_name: "Qwen 2.5 7B (Local)"
    provider: "ollama"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - json_mode
    max_context_tokens: 32768
    max_output_tokens: 8192
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0

  ollama/qwen2.5:32b:
    display_name: "Qwen 2.5 32B (Local)"
    provider: "ollama"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - json_mode
      - reasoning
    max_context_tokens: 32768
    max_output_tokens: 8192
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0

  ollama/llama3.1:8b:
    display_name: "Llama 3.1 8B (Local)"
    provider: "ollama"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - json_mode
    max_context_tokens: 131072
    max_output_tokens: 8192
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0

  ollama/all-minilm-l6-v2:
    display_name: "All-MiniLM L6 v2 (Embeddings)"
    provider: "ollama"
    capabilities:
      - embeddings
    max_context_tokens: 512
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0

  deepseek/deepseek-reasoner:
    display_name: "DeepSeek Reasoner"
    provider: "deepseek"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - reasoning
    max_context_tokens: 65536
    max_output_tokens: 8192
    cost_per_1k_input_tokens: 0.00055
    cost_per_1k_output_tokens: 0.00219

  nvidia_nim/deepseek-ai/deepseek-r1:
    display_name: "DeepSeek R1 via NVIDIA NIM"
    provider: "nvidia_nim"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - reasoning
    max_context_tokens: 65536
    max_output_tokens: 8192
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0

  nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b:
    display_name: "Nemotron 3 Ultra 550B via NVIDIA NIM"
    provider: "nvidia_nim"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - json_mode
      - reasoning
    max_context_tokens: 131072
    max_output_tokens: 8192
    cost_per_1k_input_tokens: 0.0
    cost_per_1k_output_tokens: 0.0
    notes: "Free-tier NIM model; 550B MoE strong reasoning for complex tasks"

  nvidia_nim/minimaxai/minimax-m3:
    display_name: "MiniMax M3 via NVIDIA NIM"
    provider: "nvidia_nim"
    capabilities:
      - text_generation
      - streaming
      - tool_use
      - json_mode
      - reasoning
