# ============================================================
# TSAR — TSAR Strategy Genome
# ============================================================
# Multi-layer institutional trading strategy combining session
# awareness, fundamental bias, multi-timeframe trend analysis,
# support/resistance mapping, and a structured entry pipeline.
#
# Pipeline: News → Trend → S/R → Retest → RSI → Candlestick → Execute
#
# This is the canonical genome for the TSAR Strategy .
# Parameters below are evolved by the StrategyGeneticist agent
# through mutation and fitness evaluation.
#
# See: docs/TSAR_STRATEGY.md for full documentation.

name: "tsar"
version: 1
thesis: >
  Institutional-grade multi-layer strategy that aligns trades with
  session liquidity windows, fundamental bias, multi-timeframe trends,
  and key structural levels. Executes only when the full 7-layer
  pipeline confirms: news is clear, trend aligns across D1/H4/H1,
  price is at a mapped S/R level with retest confirmation, RSI
  supports direction, and a candlestick pattern validates the entry.
status: ACTIVE

# ──────────────────────────────────────────────────────────────
# Trading Pairs
# ──────────────────────────────────────────────────────────────
# Supported asset classes. Forex majors provide high-liquidity
# setups during London/NY sessions. Crypto pairs trade 24/7
# with session-aware scoring adjustments.
symbols:
  forex_majors:
    - "EUR/USD"
    - "GBP/USD"
    - "USD/JPY"
    - "USD/CHF"
    - "AUD/USD"
    - "NZD/USD"
    - "USD/CAD"
  crypto:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"

# ──────────────────────────────────────────────────────────────
# Session Configuration (UTC times)
# ──────────────────────────────────────────────────────────────
# Trading sessions define liquidity windows. The session manager
# scores each session and applies multipliers during overlaps.
# Crypto pairs ignore session gating but still benefit from
# overlap multipliers (London/NY = highest retail crypto volume).
sessions:
  sydney:
    open: "22:00"
    close: "07:00"
    characteristics:
      - "Low liquidity"
      - "Range-bound"
      - "Sets Asian session range"
    pairs_focus:
      - "AUD/USD"
      - "NZD/USD"

  tokyo:
    open: "00:00"
    close: "09:00"
    characteristics:
      - "Moderate liquidity"
      - "JPY pairs active"
      - "Asian range establishment"
    pairs_focus:
      - "USD/JPY"
      - "AUD/JPY"

  london:
    open: "07:00"
    close: "16:00"
    characteristics:
      - "Highest liquidity"
      - "Breakout of Asian range"
      - "Trend-setting session"
    pairs_focus:
      - "EUR/USD"
      - "GBP/USD"
      - "EUR/GBP"

  new_york:
    open: "12:00"
    close: "21:00"
    characteristics:
      - "High liquidity"
      - "US data releases"
      - "London/NY overlap = peak liquidity"
    pairs_focus:
      - "EUR/USD"
      - "GBP/USD"
      - "USD/CAD"

  overlaps:
    london_new_york:
      open: "12:00"
      close: "16:00"
      description: "Peak liquidity window — highest probability setups"
      priority: 1.5  # Score multiplier during overlap

    tokyo_london:
      open: "07:00"
      close: "09:00"
      description: "Asian/London transition — breakout zone"
      priority: 1.2

# ──────────────────────────────────────────────────────────────
# Entry Rules — The 7-Layer Pipeline
# ──────────────────────────────────────────────────────────────
# Each stage produces a weighted score. The pipeline aggregates
# them into a final score. Critical stages (news_gate, trend_alignment)
# short-circuit on failure — no signal is generated if news is
# blocked or trend is neutral.
#
# Pipeline order:
#   1. News Gate       (weight 0.10) — No high-impact news in 30 min
#   2. Trend Alignment (weight 0.25) — D1/H4/H1 MAs agree
#   3. S/R Proximity   (weight 0.20) — Price at mapped level
#   4. Retest          (weight 0.15) — Rejection candle at level
#   5. RSI Filter      (weight 0.15) — RSI supports direction
#   6. Candlestick     (weight 0.15) — Pattern confirms entry
#   7. Execute         — Aggregate score ≥ threshold → signal
entry_rules:
  pipeline:
    - stage: "news_gate"
      description: "No high-impact news in next 30 min"
      weight: 0.10
      critical: true  # Short-circuits pipeline on failure

    - stage: "trend_alignment"
      description: "D1, H4, H1 MAs agree on direction"
      weight: 0.25
      critical: true  # Short-circuits pipeline on failure

    - stage: "sr_proximity"
      description: "Price at mapped S/R level within 0.3%"
      weight: 0.20

    - stage: "retest_confirmation"
      description: "Price retests level with rejection candle"
      weight: 0.15

    - stage: "rsi_filter"
      description: "RSI confirms direction (not overextended)"
      weight: 0.15

    - stage: "candlestick_pattern"
      description: "Engulfing, pin bar, or inside bar breakout"
      weight: 0.15

  # Minimum aggregated score (0.0–1.0) for a valid signal.
  # Session overlap multiplier is applied after aggregation.
  min_signal_score: 0.70

  # ── Long entry conditions ──
  long_conditions:
    - indicator: "session_active"
      description: "London or NY session (or overlap) active"
      weight: 0.05

    - indicator: "fundamental_bias"
      operator: "gte"
      value: 0.5
      description: "Fundamental bias supports long"
      weight: 0.10

    - indicator: "ma_trend"
      description: "50 MA > 200 MA on D1, H4, H1"
      weight: 0.25

    - indicator: "sr_level"
      description: "Price at support with retest"
      weight: 0.20

    - indicator: "rsi"
      period: 14
      operator: "between"
      min_value: 30
      max_value: 55
      description: "RSI between 30-55 (not overbought)"
      weight: 0.15

    - indicator: "candlestick"
      patterns: ["bullish_engulfing", "bullish_pin_bar", "morning_star"]
      description: "Bullish reversal pattern at support"
      weight: 0.15

    - indicator: "volume_confirmation"
      multiplier: 1.2
      description: "Volume above 1.2x average"
      weight: 0.10

  # ── Short entry conditions ──
  short_conditions:
    - indicator: "session_active"
      description: "London or NY session (or overlap) active"
      weight: 0.05

    - indicator: "fundamental_bias"
      operator: "gte"
      value: 0.5
      description: "Fundamental bias supports short"
      weight: 0.10

    - indicator: "ma_trend"
      description: "50 MA < 200 MA on D1, H4, H1"
      weight: 0.25

    - indicator: "sr_level"
      description: "Price at resistance with retest"
      weight: 0.20

    - indicator: "rsi"
      period: 14
      operator: "between"
      min_value: 45
      max_value: 70
      description: "RSI between 45-70 (not oversold)"
      weight: 0.15

    - indicator: "candlestick"
      patterns: ["bearish_engulfing", "bearish_pin_bar", "evening_star"]
      description: "Bearish reversal pattern at resistance"
      weight: 0.15

    - indicator: "volume_confirmation"
      multiplier: 1.2
      description: "Volume above 1.2x average"
      weight: 0.10

# ──────────────────────────────────────────────────────────────
# Exit Rules
# ──────────────────────────────────────────────────────────────
# Structured exit with partial profits, trailing stop, and
# trend reversal detection. Session-end exit closes intra-session
# trades when the active session closes.
exit_rules:
  stop_loss:
    type: "structure_based"
    description: "Behind the S/R level + ATR buffer"
    atr_buffer_multiplier: 0.5

  take_profit:
    type: "rr_multiple"
    min_rr_ratio: 2.0
    # Partial exit schedule — close at multiple R:R levels
    targets:
      - rr_multiple: 1.0
        close_pct: 0.4    # Close 40% at 1:1 R:R
      - rr_multiple: 2.0
        close_pct: 0.3    # Close 30% at 2:1 R:R
      - rr_multiple: 3.0
        close_pct: 0.3    # Close 30% at 3:1 R:R

  trailing_stop:
    enabled: true
    type: "atr_multiple"
    trigger_rr: 1.0       # Start trailing after 1:1 R:R
    atr_multiplier: 1.5

  session_exit:
    enabled: true
    close_at_session_end: true
    description: "Close intra-session trades at session end"

  breakeven:
    trigger_rr: 1.0
    description: "Move stop to breakeven at 1:1 R:R"

# ──────────────────────────────────────────────────────────────
# Technical Parameters
# ──────────────────────────────────────────────────────────────
# Core indicator settings. Moving averages define trend direction,
# RSI filters overextended conditions, ATR sizes stops, and
# volume confirms institutional participation.
technical:
  moving_averages:
    fast_period: 50
    slow_period: 200
    type: "SMA"  # Simple Moving Average
    timeframes: ["D1", "H4", "H1"]

  rsi:
    period: 14
    oversold: 30
    overbought: 70
    # RSI acts as a filter, not a primary signal.
    # Long entries require RSI in [30, 55]; shorts in [45, 70].
    long_range: [30, 55]
    short_range: [45, 70]

  atr:
    period: 14
    timeframes: ["H1", "H4"]

  volume:
    lookback: 20
    multiplier: 1.2

# ──────────────────────────────────────────────────────────────
# S/R Level Mapping
# ──────────────────────────────────────────────────────────────
# Levels are mapped from multiple timeframes and sources.
# Each level has a strength weight used for proximity scoring.
# Order blocks represent institutional supply/demand zones.
sr_levels:
  asian_session:
    enabled: true
    description: "Asian session high/low as S/R"
    breakout_confirmation_candles: 2

  daily_levels:
    enabled: true
    sources: ["previous_day_high", "previous_day_low", "daily_open"]

  weekly_levels:
    enabled: true
    sources: ["previous_week_high", "previous_week_low", "weekly_open"]

  monthly_levels:
    enabled: true
    sources: ["previous_month_high", "previous_month_low"]

  yearly_levels:
    enabled: true
    sources: ["yearly_open", "yearly_high", "yearly_low"]

  order_blocks:
    enabled: true
    min_body_pct: 0.3      # Minimum candle body as % of range
    lookback_candles: 100
    proximity_pct: 0.3     # Price must be within 0.3% of OB

  # Strength weights for level ranking (higher = more significant)
  level_weights:
    order_block: 1.0
    asian_hl: 0.9
    daily_hl: 0.8
    weekly_hl: 0.7
    monthly_hl: 0.6
    yearly: 0.5

# ──────────────────────────────────────────────────────────────
# Sizing
# ──────────────────────────────────────────────────────────────
# Half-Kelly criterion with exchange fee awareness.
# Position size scales with session liquidity and regime.
sizing:
  method: "half_kelly"
  kelly_fraction: 0.25
  max_position_pct: 0.10
  risk_per_trade_pct: 0.015
  max_open_positions: 3

# ──────────────────────────────────────────────────────────────
# Risk Constraints
# ──────────────────────────────────────────────────────────────
# Hard limits enforced by RiskGuardian before every trade.
risk_constraints:
  max_stop_loss_pct: 0.02
  min_rr_ratio: 2.0
  max_correlation: 0.7
  required_stop_loss: true
  session_aware_sizing: true
  reduce_size_during_news: true

