# ──────────────────────────────────────────────────────────────
# Backtesting
# ──────────────────────────────────────────────────────────────
# Walk-forward validation with realistic fee and slippage models.
backtesting:
  walk_forward:
    train_pct: 70
    validation_pct: 15
    test_pct: 15
  fee_model: "binance"
  slippage_model: "realistic"
  significance_threshold: 0.05

# ──────────────────────────────────────────────────────────────
# Retirement Gates
# ──────────────────────────────────────────────────────────────
# If performance degrades below these thresholds, the strategy
# is paused or retired pending re-optimization.
retirement_gates:
  rolling_sharpe_30d_min: 0.5
  max_drawdown_pause: 0.10
  max_drawdown_retire: 0.15
  min_win_rate_50_trades: 0.45
