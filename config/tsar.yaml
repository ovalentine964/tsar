# TSAR Configuration — Working Defaults
# Run: python3 -m src --paper

environment: development
trading_mode: paper

database:
  db_path: data/tsar.db
  journal_mode: WAL

exchange:
  name: binance
  sandbox: true
  symbols:
    - BTC/USDT
    - ETH/USDT
  rate_limit_per_minute: 1200

risk:
  # Day 1 simplified defaults for paper trading.
  # See config/risk.yaml for canonical, full-parameter risk configuration.
  daily_loss_limit_pct: 2.0
  max_drawdown_pct: 5.0
  max_open_positions: 3
  max_single_position_pct: 15.0
  kelly_fraction: 0.25
  min_risk_reward: 2.0
  max_daily_trades: 30

llm:
  # NVIDIA NIM is primary (free tier, cloud-hosted, no local RAM needed)
  # DeepSeek is fallback. Ollama disabled by default.
  # Set TSAR_ENABLE_OLLAMA=1 to re-enable local LLM.
  default_provider: nvidia_nim
  nvidia_nim_base_url: https://integrate.api.nvidia.com/v1
  deepseek_api_key: null
  deepseek_base_url: https://api.deepseek.com
  ollama_base_url: http://localhost:11434
  ollama_model: qwen2.5:7b
  ollama_enabled: false
  request_timeout_s: 60.0
  # See config/models.yaml for full model routing and fallbacks

strategy:
  default_strategy: mean_reversion
  min_trades_for_evaluation: 30
  min_win_rate: 0.45
  min_profit_factor: 1.2

logging:
  level: INFO
  json_output: false
