# ============================================================
# TSAR — NVIDIA Skills Configuration
# ============================================================
# Controls optional NVIDIA GPU-accelerated skill integrations.
# All skills degrade gracefully if unavailable.
# See: council_reviews/fix_teams/NVIDIA_SKILLS_INTEGRATION_SUMMARY.md

# --- cuFOLIO: GPU-Accelerated Portfolio Optimization ---
cufolio:
  enabled: true
  # Mean-CVaR portfolio optimization
  optimization:
    method: "mean_cvar"           # mean_cvar | mean_variance | risk_parity
    confidence_level: 0.95        # CVaR confidence level
    max_iterations: 1000
    tolerance: 1e-6
  # Efficient frontier generation
  frontier:
    num_portfolios: 100           # Points on the efficient frontier
    min_return: 0.0               # Minimum target return
    max_return: 0.5               # Maximum target return
  # Scenario generation for Monte Carlo
  scenarios:
    num_scenarios: 10000
    lookback_days: 252            # 1 year of daily data
    method: "historical"          # historical | parametric | copula
  # Backtesting
  backtest:
    rebalance_frequency: "weekly" # daily | weekly | monthly
    transaction_cost_bps: 10      # 10 bps round-trip cost
  # Fallback: use Python scipy if cuFOLIO unavailable
  fallback: "scipy"

# --- cuOpt: Numerical Optimization API ---
cuopt:
  enabled: true
  # Multi-objective optimization for strategy parameters
  objectives:
    - name: "win_rate"
      weight: 0.3
      direction: "maximize"
    - name: "profit_factor"
      weight: 0.3
      direction: "maximize"
    - name: "max_drawdown"
      weight: 0.2
      direction: "minimize"
    - name: "sharpe_ratio"
      weight: 0.2
      direction: "maximize"
  # Solver settings
  solver:
    time_limit_seconds: 30
    mip_gap: 0.01                 # MIP optimality gap
    num_threads: 4
  # Parameter bounds for optimization
  parameter_bounds:
    rsi_period: [5, 50]
    macd_fast: [5, 20]
    macd_slow: [15, 50]
    macd_signal: [5, 15]
    bb_period: [10, 50]
    bb_std_dev: [1.0, 3.0]
    atr_period: [5, 30]
  # Fallback: use scipy.optimize if cuOpt unavailable
  fallback: "scipy"

# --- RAG Blueprint: Enhanced Retrieval-Augmented Generation ---
rag_blueprint:
  enabled: true
  # Reranking configuration
  reranking:
    enabled: true
    model: "nvidia/nv-rerankqa-mistral-4b-v3"
    top_k: 10                     # Number of results to rerank
    batch_size: 32
  # Chunking strategy
  chunking:
    strategy: "semantic"          # semantic | fixed | recursive
    max_chunk_tokens: 512
    overlap_tokens: 64
  # Hybrid search weights (FTS5 + vector)
  hybrid_search:
    fts_weight: 0.4
    vector_weight: 0.6            # Favor semantic for better context
  # Knowledge stores to enhance
  stores:
    - "trade_records"
    - "strategy_genomes"
    - "patterns"
    - "lessons"
    - "market_state"
  # Fallback: use existing FTS5 + ChromaDB hybrid search
  fallback: "fts5_chromadb"

# --- Nemo Evaluator: Agent Output Quality Evaluation ---
nemo_evaluator:
  enabled: true
  # Evaluation dimensions
  dimensions:
    - name: "factual_accuracy"
      weight: 0.25
      description: "Are claims supported by market data?"
    - name: "risk_awareness"
      weight: 0.25
      description: "Does output consider risk implications?"
    - name: "actionability"
      weight: 0.25
      description: "Can the output be directly acted upon?"
    - name: "coherence"
      weight: 0.25
      description: "Is the reasoning logical and consistent?"
  # Scoring
  scoring:
    min_acceptable_score: 0.6     # Below this → flag for review
    auto_reject_threshold: 0.3    # Below this → auto-reject output
  # Evaluation frequency
  evaluation:
    sample_rate: 0.1              # Evaluate 10% of LLM outputs
    full_eval_interval_hours: 24  # Full evaluation every 24h
  # Fallback: use existing LLMEvaluator
  fallback: "internal"

# --- Nemotron Policy Generator: Risk Policy Generation ---
nemotron_policy:
  enabled: true
  # Policy generation parameters
  generation:
    model: "nvidia/nemotron-3-ultra"
    max_policies: 20
    confidence_threshold: 0.8
  # Policy categories
  categories:
    - "position_limits"
    - "drawdown_rules"
    - "correlation_limits"
    - "volatility_adjustments"
    - "regime_adaptive_rules"
  # Validation
  validation:
    require_approval: true        # Human must approve generated policies
    test_on_historical: true      # Backtest policies before deployment
    min_backtest_sharpe: 0.5      # Minimum Sharpe for policy acceptance
  # Fallback: use existing risk.yaml static rules
  fallback: "static_rules"
