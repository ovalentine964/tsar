# ============================================================
# TSAR — Default Application Configuration
# ============================================================
# Main config for app, database, Redis, and logging.
# See docs/ARCHITECTURE.md for system overview.

# --- Application ---
app:
  name: "TSAR"
  version: "0.2.0"
  environment: "development"     # development | staging | production
  trading_mode: "paper"          # paper | live
  log_level: "INFO"

# --- Paper Trading ---
paper:
  initial_balance: 10.0           # Valentine's $10 starting balance
  fee_rate: 0.001                 # 0.1% Binance spot fee
  slippage_bps: 2.0               # Simulated slippage (basis points)
  quote_currency: "USDT"          # Quote currency for balance tracking

# --- Paper → Live Gate ---
paper_gate:
  min_paper_trades: 50            # Minimum paper trades before live
  min_paper_days: 7               # Minimum days in paper mode
  min_win_rate: 0.55              # Minimum win rate (55%) to go live
  enforce: true                   # Enforce gate (false = skip checks)

# --- Database ---
database:
  path: "data/tsar.db"
  echo: false                    # SQL query logging
  pool_size: 5
  max_overflow: 10
  backup:
    hot_interval_minutes: 15
    hot_retention_hours: 24
    warm_cron: "0 0 * * *"      # Daily at midnight UTC
    warm_retention_days: 30
    cold_cron: "0 0 * * 0"      # Weekly on Sunday
    cold_retention_days: 365

# --- Redis ---
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD}"
  decode_responses: true
  socket_timeout: 5
  socket_connect_timeout: 5
  retry_on_timeout: true
  health_check_interval: 30
  key_prefix: "tsar:"

# --- Logging ---
logging:
  format: "json"                 # json | console
  level: "INFO"
  file:
    enabled: true
    path: "logs/tsar.log"
    rotation: "daily"
    retention_days: 30
    compression: true
  console:
    enabled: true
    colorize: true
  structlog:
    processors:
      - "structlog.processors.TimeStamper"
      - "structlog.processors.add_log_level"
      - "structlog.processors.StackInfoRenderer"
      - "structlog.processors.format_exc_info"
      - "structlog.processors.JSONRenderer"

# --- API Server ---
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: []
  api_key: "${TSAR_API_KEY}"

# --- Agent Supervisor ---
supervisor:
  host: "0.0.0.0"
  port: 8001
  heartbeat_interval_s: 5
  stale_threshold_s: 15

# --- Telegram ---
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  alert_levels:
    critical: true
    warning: true
    info: false

# --- Exchanges ---
exchanges:
  primary: "binance"
  sandbox: true
  rate_limit_per_minute: 1200
  symbols:
    - "BTC/USDT"
    # - "ETH/USDT"    # Level 2+

# --- DeFi (On-Chain) ---
defi:
  testnet: true                     # true = Sepolia/devnet, false = mainnet
  wallet_path: "data/wallets.enc"   # Encrypted wallet storage
  master_key_env: "TSAR_WALLET_MASTER_KEY"
  slippage_tolerance: 1.0           # Default slippage tolerance (%)
  confirmation_timeout_s: 120       # TX receipt wait timeout
  oneinch_api_key: ""               # 1inch API key (optional)
  rpc_endpoints:
    ethereum: "https://rpc.sepolia.org"
    polygon: "https://rpc-amoy.polygon.technology"
    arbitrum: "https://sepolia-rollup.arbitrum.io/rpc"
    base: "https://sepolia.base.org"
    solana: "https://api.devnet.solana.com"

# --- MEV Protection ---
mev:
  enabled: true
  flashbots_enabled: true           # Use Flashbots Protect on Ethereum
  jito_enabled: true                # Use Jito bundles on Solana
  sandwich_detection: true          # Monitor for sandwich attacks
  simulation_required: true         # Simulate before submission
  max_priority_fee_gwei: 3          # Max priority fee for EIP-1559

# --- Oracle ---
oracle:
  enabled: true
  chainlink_enabled: true           # Chainlink price feeds
  pyth_enabled: true                # Pyth Network feeds
  twap_window_seconds: 3600         # TWAP computation window (1h)
  deviation_threshold_pct: 2.0      # Alert when CEX/DEX price diverges >2%
  update_interval_s: 30             # Price refresh interval

# --- Watchdog ---
watchdog:
  enabled: true
  tier1_heartbeat_s: 5
  tier2_heartbeat_s: 5
  tier3_check_interval_s: 10
  stale_threshold_s: 15

# --- Monitoring ---
monitoring:
  prometheus:
    enabled: false
    port: 9090
  grafana:
    enabled: false
    port: 3000
