# ============================================================
# TSAR — Balanced Blueprint
# ============================================================
# Medium risk, medium returns. The default starting point.
# Good risk/reward with reasonable position diversity.
#
# Profile: Intermediate traders, moderate accounts
# Target: 5-15% monthly, max 10% drawdown
# Time commitment: Medium (daily review)

blueprint:
  name: "balanced"
  display_name: "Balanced Growth"
  description: >
    Balanced approach combining trend-following and mean-reversion.
    Moderate risk with diversified strategy allocation.
    The recommended starting blueprint for most traders.
  target_audience:
    experience: ["intermediate", "advanced"]
    account_size_range_usd: [5000, 500000]
    risk_tolerance: "medium"
    time_horizon: "days_to_weeks"
  tags: ["balanced", "default", "diversified"]

# --- Risk Profile ---
risk:
  max_risk_per_trade_pct: 0.02        # 2% per trade
  max_portfolio_heat_pct: 0.06        # 6% total exposure
  max_open_positions: 5
  max_daily_trades: 10
  max_drawdown_pause: 0.05            # Pause at 5% drawdown
  max_drawdown_flatten: 0.10          # Flatten at 10% drawdown
  kelly_fraction: 0.25                # Standard half-Kelly
  min_rr_ratio: 2.0
  anti_revenge_cooldown_minutes: 60

# --- Strategy Mix ---
strategies:
  primary:
    name: "tsar"
    allocation_pct: 50
    overrides:
      min_signal_score: 0.70

  secondary:
    name: "momentum_funding"
    allocation_pct: 30
    overrides:
      min_signal_score: 0.65

  tertiary:
    name: "mean_reversion"
    allocation_pct: 20
    overrides:
      min_signal_score: 0.60

# --- Sizing ---
sizing:
  method: "half_kelly"
  base_allocation_pct: 75
  max_position_pct: 0.12
  scale_in: true                      # Allow scaling in
  scale_in_levels: 2
  scale_in_size_pct: 0.5              # 50% each level

# --- Time Filters ---
time_filters:
  preferred_sessions: ["london", "new_york", "london_new_york_overlap"]
  avoid_sessions: ["sydney"]
  blackout_before_news_minutes: 30

# --- Asset Filters ---
asset_filters:
  allowed_classes: ["crypto"]
  min_liquidity_usd: 200000
  min_volume_24h_usd: 5000000
  max_volatility_pct: 8.0

# --- Exit Rules ---
exit_rules:
  stop_loss:
    type: "atr_multiple"
    multiplier: 1.0
  take_profit:
    type: "rr_multiple"
    targets:
      - rr_multiple: 1.0
        close_pct: 0.3
      - rr_multiple: 2.0
        close_pct: 0.4
      - rr_multiple: 3.0
        close_pct: 0.3
  trailing_stop:
    enabled: true
    trigger_rr: 1.0
    atr_multiplier: 1.5
  time_stop_hours: 48

# --- Notifications ---
alerts:
  on_entry: true
  on_exit: true
  on_stop_hit: true
  daily_summary: true
  drawdown_warning_pct: 0.03
